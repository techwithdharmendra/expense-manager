name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Install dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Setup Android Project via Capacitor
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          if [ -f build.gradle ]; then
            cp build.gradle android/app/build.gradle
            echo "Successfully applied custom root build.gradle"
          fi

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        working-directory: ./android
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Warning: No KEYSTORE_BASE64 secret found. Generating a temporary keystore. THIS WILL CAUSE A SIGNATURE MISMATCH ON PLAY STORE."
            keytool -genkey -v -keystore release.keystore -alias releasealias -keyalg RSA -keysize 2048 -validity 10000 -storepass "password123" -keypass "password123" -dname "CN=WalletTracker, OU=App, O=WalletTracker, L=City, ST=State, C=US"
            KEYSTORE_FILE="release.keystore"
            KP_PASS="pass:password123"
            KS_PASS="pass:password123"
          else
            echo "Using keystore from GitHub Secrets"
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            KEYSTORE_FILE="release.keystore"
            # If key password is not set, fallback to keystore password
            if [ -z "$KEY_PASSWORD" ]; then
              KEY_PASSWORD=$KEYSTORE_PASSWORD
            fi
            KP_PASS="pass:$KEY_PASSWORD"
            KS_PASS="pass:$KEYSTORE_PASSWORD"
          fi

          # Find the built release APK (unsigned)
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*-unsigned.apk" | head -n 1)

          # Get the absolute path to apksigner and zipalign
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          ZIPALIGN_PATH="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER_PATH="$BUILD_TOOLS_DIR/apksigner"

          # Zipalign the APK
          $ZIPALIGN_PATH -v -p 4 $APK_PATH app-release-unsigned-aligned.apk

          # Sign the aligned APK
          $APKSIGNER_PATH sign --ks $KEYSTORE_FILE --ks-pass "$KS_PASS" --key-pass "$KP_PASS" --in app-release-unsigned-aligned.apk --out Wallet-Tracker-Release-Signed.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wallet-Tracker-Release
          path: Wallet-Tracker-Release-Signed.apk
          retention-days: 7
